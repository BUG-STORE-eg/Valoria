<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VALORIA ROLEPLAY | Store</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f4f7ff;font-family:Arial,sans-serif}
header{padding:24px 5%;background:#111a30;border-bottom:1px solid #263553;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:900;color:#65a8ff}.hero{padding:35px 5%;background:linear-gradient(120deg,#14284c,#101629)}
.hero h1{margin:0 0 10px;font-size:32px}.hero p{color:#b8c7df}
.wrap{padding:24px 5%;display:grid;grid-template-columns:220px 1fr;gap:22px}.side,.item{background:#121b30;border:1px solid #263553;border-radius:14px;padding:16px}
.side h3{margin-top:0}.side button{display:block;width:100%;text-align:right;margin:7px 0;padding:11px;border:0;border-radius:8px;background:#1b2b49;color:#eaf2ff;cursor:pointer}
.tools{display:flex;gap:10px;margin-bottom:16px}.tools input{flex:1;padding:12px;border-radius:9px;border:1px solid #344765;background:#0d1527;color:white}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.item{text-align:center}.pic{height:125px;display:grid;place-items:center;font-size:54px;background:#0d1527;border-radius:10px}.stock{color:#65a8ff;margin:10px}.price{color:#65a8ff;font-weight:bold;margin:10px}.item button,.buy{background:#2879ee;color:white;border:0;padding:11px 18px;border-radius:9px;cursor:pointer}
@media(max-width:850px){.wrap{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="logo">VALORIA</div><div>ROLEPLAY STORE　|　🛒 <span id="count">0</span></div></header>
<section class="hero"><h1>VALORIA Complete Store</h1><p>متجر مقاطعة ڤالوريا — اختار احتياجاتك داخل السيرفر</p></section>
<div class="wrap"><aside class="side"><h3>الأقسام</h3><div id="cats"></div></aside><main><div class="tools"><input id="search" placeholder="ابحث عن منتج..." oninput="render()"></div><div class="grid" id="products"></div></main></div>
<script>
const products=[
{id:1,name:"سيارة رياضية — مثال",category:"السيارات",price:"يحدد لاحقاً",stock:"متاح",icon:"🏎️"},
{id:2,name:"سيارة فاخرة — مثال",category:"السيارات",price:"يحدد لاحقاً",stock:"متاح",icon:"🚘"},
{id:3,name:"عضوية VIP — مثال",category:"العضويات",price:"يحدد لاحقاً",stock:"متاح",icon:"👑"},
{id:4,name:"بطاقة / رخصة — مثال",category:"البطاقات والرخص",price:"يحدد لاحقاً",stock:"متاح",icon:"🪪"},
{id:5,name:"أداة — مثال",category:"الأدوات",price:"يحدد لاحقاً",stock:"متاح",icon:"🧰"},
{id:6,name:"باقة — مثال",category:"الباقات",price:"يحدد لاحقاً",stock:"متاح",icon:"🎁"}
];
let selected="الكل",cart=0;
function init(){let cats=["الكل",...new Set(products.map(p=>p.category))];document.getElementById("cats").innerHTML=cats.map(c=>`<button onclick="selected='${c}';render()">${c}</button>`).join("");render()}
function render(){let q=document.getElementById("search").value.toLowerCase();let list=products.filter(p=>(selected==="الكل"||p.category===selected)&&p.name.toLowerCase().includes(q));document.getElementById("products").innerHTML=list.map(p=>`<article class="item"><div class="pic">${p.icon}</div><div class="stock">${p.stock}</div><h3>${p.name}</h3><div class="price">${p.price} USD</div><button onclick="cart++;document.getElementById('count').textContent=cart">إضافة للسلة</button></article>`).join("")||"مفيش منتجات مطابقة"}
init();
</script></body></html>
